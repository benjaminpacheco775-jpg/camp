.hide{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}

.go{width:100%;margin-top:16px;border:0;border-radius:12px;padding:12px;font-weight:800;background:linear-gradient(135deg,var(--pr2),#9333ea);color:#fff}

 profjorge:{nombre:"Prof. Jorge Ramírez",mats:["*:Física II","4:Química","*:Hardware","*:Hardware II","*:Hardware III","6:Mantenimiento de Hardware"]},
 profsofia:{nombre:"Prof. Sofía Torres",mats:["*:Software","*:Software II","*:Software III","*:Lógica y Programación","*:Lógica y Programación II","*:Programación Web","*:Programación Web II","6:Mantenimiento de Software"]},
 profcarlos:{nombre:"Prof. Carlos Benítez",mats:["4:Redes"]}
};
const USERS={};
for(let i=1;i<=6;i++)USERS["alumno"+i]={rol:"E",pass:"1234",anio:i,nombre:"Estudiante de "+i+".º año"};
for(const[k,v]of Object.entries(PROFES))USERS[k]={rol:"P",pass:"1234",nombre:v.nombre,mats:v.mats};
const $=id=>document.getElementById(id);
let user=null,rol="E",H={},dbc=null,sel={},cur=null,q="";
const key=(a,m,t)=>a+"_"+Object.keys(TEMARIO[a]).indexOf(m)+"_"+t;
const estaHab=(a,m,t)=>{const k=key(a,m,t);return k in H?H[k]:t===0};
function loadLocal(){try{H=JSON.parse(localStorage.getItem("campus34_hab")||"{}")}catch(e){H={}}}
function saveLocal(){try{localStorage.setItem("campus34_hab",JSON.stringify(H))}catch(e){}}
loadLocal();
(async()=>{try{const db=await claude.use("db");if(!db)return;dbc=db.collection("hab");
 dbc.onSnapshot(s=>{const n={};s.docs.forEach(d=>{const x=d.data();if(x)n[d.id]=!!x.on});H=n;if(user)render()},()=>{dbc=null})}catch(e){dbc=null}})();
async function setHab(a,m,t,on){const k=key(a,m,t);H[k]=on;
 if(dbc){try{await dbc.doc(k).set({on})}catch(e){alert("No se pudo guardar el cambio. ¿Tenés permiso de edición?")}}else saveLocal();render()}
// ---- Información por tipo de materia ----
function cat(m){if(/^(Matemática|Probabilidad)/.test(m))return"mate";if(/^(Física|Química)/.test(m))return"cien";if(/^(Lengua|Historia|Ética|Marco)/.test(m))return"lect";
 if(/^Inglés/.test(m))return"ing";if(/^Dibujo/.test(m))return"dib";if(/^(Lógica|Programación)/.test(m))return"prog";if(/^(Proyecto|Microemprendimiento)/.test(m))return"proy";return"tec"}
const EVAL={mate:[2,2],cien:[2,2],lect:[2,1],ing:[2,2],dib:[3,0],prog:[3,1],proy:[2,0],tec:[3,1]}; // [trabajos prácticos, pruebas] por trimestre (estimado)
const GUIA={
mate:["Leé la teoría y escribí con tus palabras qué es «{t}»: {d}.","Copiá las fórmulas o reglas y un ejemplo resuelto de cada una.","Resolvé al menos 5 ejercicios, de fácil a difícil, sin mirar el ejemplo.","Corregí con tu profesor o compañeros y marcá los errores para repasar antes de la prueba."],
lect:["Leé el material y subrayá las ideas principales de «{t}»: {d}.","Armá un esquema o cuadro con los conceptos, fechas o autores clave.","Respondé en voz alta: ¿qué es?, ¿por qué importa?, ¿cómo se relaciona con el tema anterior?","Hacé un resumen de 5 líneas y compará con tu carpeta."],
ing:["Repasá la estructura de «{t}»: {d}.","Escribí 5 oraciones propias usando el tema.","Armá una lista de vocabulario nuevo con su traducción.","Leé un texto corto y subrayá dónde aparece el tema."],
dib:["Mirá los ejemplos de «{t}» en tu carpeta: {d}.","Practicá el procedimiento (en papel o en el programa) con un ejercicio de borrador.","Repetilo sin mirar el modelo y compará el resultado.","Revisá la prolijidad: líneas, rótulo y medidas."],
prog:["Entendé la idea de «{t}»: {d}.","Escribí el ejemplo del profesor sin copiarlo y probá que funcione.","Modificalo: cambiá valores y mirá qué pasa.","Resolvé un ejercicio nuevo por tu cuenta y anotá los errores que te aparecieron."],
proy:["Releé el objetivo de «{t}»: {d}.","Anotá qué entregas o avances te pide el profesor.","Armá un plan con fechas para cada parte.","Pedí una revisión antes de la entrega."],
tec:["Entendé el concepto de «{t}»: {d}.","Hacé un resumen con los términos técnicos y qué hace cada uno.","Practicá en el taller, el laboratorio o un simulador lo que viste.","Anotá los pasos y los errores comunes para poder explicarlo."]};
function evalInfo(m){let[tp,pr]=EVAL[cat(m)];if(m==="Ética")pr=0;return{tp,pr}}
function guia(m,top){const[t,d]=top.split("~");return GUIA[cat(m)].map(s=>s.replace("{t}",t).replace("{d}",d))}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
// ---- Vistas ----
function setRol(r){rol=r;$("rE").classList.toggle("on",r==="E");$("rP").classList.toggle("on",r==="P");
 $("hint").innerHTML=r==="E"?"Demo: <b>alumno1</b> a <b>alumno6</b> (según el año), contraseña <b>1234</b>.":"Demo: <b>profana</b>, <b>profluis</b>, <b>profmarta</b>, <b>profjulia</b>, <b>profroberto</b>, <b>proflaura</b>, <b>profjorge</b>, <b>profsofia</b>, <b>profcarlos</b>. Contraseña <b>1234</b>."}
$("rE").onclick=()=>setRol("E");$("rP").onclick=()=>setRol("P");setRol("E");
function login(){const u=USERS[$("u").value.trim().toLowerCase()];
 if(!u||u.pass!==$("c").value||u.rol!==rol){$("err").textContent="Usuario o contraseña incorrectos.";return}
 user=u;cur=null;$("err").textContent="";$("vLogin").classList.add("hide");$("vApp").classList.remove("hide");render()}
function render(){user.rol==="E"?renderE():renderP()}
function hero(t,p,c){return"<div class='hero'><span class='chip'>"+c+"</span><h1>"+t+"</h1><p>"+p+"</p></div>"}
function renderE(){const a=user.anio,M=$("main");
 if(cur&&!TEMARIO[a][cur])cur=null;
 if(!cur){
  M.innerHTML=hero("Hola 👋","Acá encontrás el temario de cada materia, trimestre por trimestre. Los trimestres se habilitan a medida que avanzás.",a+".º año")+"<input class='search' id='q' placeholder='Buscar materia…' aria-label='Buscar materia'><div class='grid' id='cards'></div>";
  $("q").value=q;$("q").oninput=e=>{q=e.target.value;cards()};cards();return}
 const tris=TEMARIO[a][cur],{tp,pr}=evalInfo(cur);
 const last=tris.reduce((r,_,t)=>estaHab(a,cur,t)?t:r,0),t0=sel[a+cur]??last;
 M.innerHTML="<button class='ghost back' id='bk'>← Mis materias</button><div class='dh'><div class='ic' style='--h:"+hue(cur)+";margin:0'>"+cur[0]+"</div><div><h2>"+cur+"</h2><small>"+a+".º año</small></div></div><div class='tabs' id='tb'></div><div id='bd'></div>";
 $("bk").onclick=()=>{cur=null;renderE();scrollTo(0,0)};
 const show=t=>{sel[a+cur]=t;[...$("tb").children].forEach((b,i)=>b.classList.toggle("on",i===t));
  const bd=$("bd");if(!estaHab(a,cur,t)){bd.innerHTML="<div class='locked'><div style='font-size:2rem'>🔒</div><b>Este trimestre todavía no está habilitado</b><br>Tu profesor lo va a habilitar cuando empiece el trimestre.</div>";return}
  const tops=tris[t].split("|"),n=tops.map(x=>x.split("~"));
  bd.innerHTML="<div class='card'><h3 class='th'>Qué vas a ver este trimestre</h3><p class='intro'>Empezás con <b>«"+n[0][0]+"»</b> ("+n[0][1]+") y después seguís con <b>«"+n[1][0]+"»</b> ("+n[1][1]+").</p><div class='chips'><div class='cp'><b>📝 "+tp+"</b>trabajos prácticos</div><div class='cp'><b>"+(pr?"✅ "+pr:"—")+"</b>"+(pr?(pr===1?"prueba escrita":"pruebas escritas"):"sin pruebas escritas: se evalúa con trabajos")+"</div></div><div class='note'>Las cantidades son estimadas: tu profesor confirma las fechas y puede ajustarlas.</div></div>"+
   tops.map((x,i)=>"<details"+(i===0?" open":"")+"><summary><div>"+n[i][0]+"<span>"+n[i][1]+"</span></div></summary><div class='gb'><h4>📖 Guía de estudio</h4><ol>"+guia(cur,x).map(s=>"<li>"+s+"</li>").join("")+"</ol></div></details>").join("")};
 tris.forEach((_,t)=>{const h=estaHab(a,cur,t),b=document.createElement("button");b.className="tab"+(h?"":" lock");b.textContent=(h?"":"🔒 ")+(t+1)+".º trimestre";b.onclick=()=>show(t);$("tb").appendChild(b)});
 show(t0)}
function cards(){const a=user.anio,box=$("cards");box.innerHTML="";
 Object.entries(TEMARIO[a]).filter(([m])=>m.toLowerCase().includes(q.trim().toLowerCase())).forEach(([m,tr])=>{
  const b=document.createElement("button");b.className="sc";b.style.setProperty("--h",hue(m));
  const on=tr.filter((_,t)=>estaHab(a,m,t)).length;
  b.innerHTML="<div class='ic'>"+m[0]+"</div><b>"+m+"</b><div class='dots'>"+tr.map((_,t)=>"<i class='"+(estaHab(a,m,t)?"on":"")+"'></i>").join("")+"</div><small>"+on+" de 3 trimestres disponibles</small>";
  b.onclick=()=>{cur=m;renderE();scrollTo(0,0)};box.appendChild(b)});
 if(!box.children.length)box.innerHTML="<p style='color:var(--mu)'>No encontramos esa materia.</p>"}
function mine(a,m){return user.mats.some(x=>{const[ya,ym]=x.split(":");return(ya==="*"||ya==a)&&ym===m})}
function renderP(){const M=$("main");
 M.innerHTML=hero("Hola, "+user.nombre,"Activá el interruptor de un trimestre para que tus estudiantes vean su temario. Solo aparecen tus materias.","Panel de profesores");
 for(let a=1;a<=6;a++)Object.keys(TEMARIO[a]).forEach(m=>{if(!mine(a,m))return;
  const tris=TEMARIO[a][m],s=document.createElement("div");s.className="card";
  const h2=document.createElement("h3");h2.className="th";h2.textContent=m;const p=document.createElement("span");p.className="pill";p.textContent=a+".º año";h2.appendChild(p);s.appendChild(h2);
  tris.forEach((tp,t)=>{const on=estaHab(a,m,t),r=document.createElement("div");r.className="row";
   r.innerHTML="<div><b>"+(t+1)+".º trimestre</b><small></small></div>";r.querySelector("small").textContent=tp.split("|").map(x=>x.split("~")[0]).join(" · ");
   const b=document.createElement("button");b.className="sw"+(on?" on":"");b.setAttribute("role","switch");b.setAttribute("aria-checked",on);b.setAttribute("aria-label",m+" "+a+".º año, "+(t+1)+".º trimestre");
   b.onclick=()=>setHab(a,m,t,!on);r.appendChild(b);s.appendChild(r)});
  M.appendChild(s)})}
$("go").onclick=login;$("c").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("out").onclick=()=>{user=null;cur=null;$("c").value="";$("vApp").classList.add("hide");$("vLogin").classList.remove("hide")};
</script>
</body>
</html>
